{{- $name := printf "%s-agones" (include "platform-vcluster-template.velocityName" .) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform-vcluster-template.velocityLabels" . | nindent 4 }}
rules:
  - apiGroups: ["agones.dev"]
    resources: ["gameservers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform-vcluster-template.velocityLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform-vcluster-template.velocityName" . }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
