        app.kubernetes.io/instance: platform
        app.kubernetes.io/component: default-fleet
        agones.dev/fleet: "lobby"
    spec:
      ports:
        - name: default
          portPolicy: Dynamic
          containerPort: 7654
          protocol: UDP
      template:
        spec:
          containers:
            - name: simple-game-server
              image: "gcr.io/agones-images/simple-game-server:0.30"
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
